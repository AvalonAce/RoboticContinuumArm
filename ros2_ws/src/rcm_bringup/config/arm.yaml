# RCM arm configuration. Values marked PLACEHOLDER must be measured on the real build.
hw_bridge:
  ros__parameters:
    port: ""              # "" = auto-detect (RCM_PORT, /dev/serial/by-id/*CP210*, ttyUSB*)
    hz: 50                # telemetry rate; keep <= 50 with 3 servos (115200-baud USB link)
    ids: [1, 2, 3]
    load_limit: 900       # |load| above this -> torque off (trip). Lower once you know real tension levels
    temp_limit: 60        # degC
    default_speed: 400
    default_acc: 30
    soft_min: [50, 50, 50]        # servo range 0..4095 (single turn); home is re-centred to 2048
    soft_max: [4045, 4045, 4045]  # -> ~1998 counts (33.7 mm) of travel each way from home

kinematics:
  ros__parameters:
    length_mm: 200.0          # PLACEHOLDER  section length L
    tendon_radius_mm: 15.0    # PLACEHOLDER  backbone axis -> tendon routing hole
    spool_radius_mm: 11.0     # Motorwheel.STL groove floor (22 mm dia); add half the line diameter if thick
    ids: [1, 2, 3]
    angles_deg: [0.0, 120.0, 240.0]   # tendon i angular position around backbone
    reel_in_sign: [-1, -1, -1]   # measured: 'A' in rcm spool (counts decreasing) reels in on all three
    takeup_mm: 0.0            # extra common-mode reel-in (pretension trim)
    theta_max_deg: 90.0
    pretension_allowance_mm: 3.0   # expected reel-in from "slight slack" to taut; shifts the rest pose
    rest_counts: [-1, -1, -1]      # winding rest pose per servo; -1 = auto (center, offset by allowance)
    rest_speed: 150
    calibration_file: ""      # "" = $RCM_ROOT/config/calibration.yaml

sensor_bridge:
  ros__parameters:
    port: ""              # "" = auto-detect sensor board (never the CP210x servo board); launch arg sensor_port:=
    beta: 0.08            # Madgwick gain: higher trusts accel more (faster, noisier), lower trusts gyro
    bias_s: 2.0           # still time needed for gyro-bias calibration at startup
    frame_id: rcm_imu_link

flex_bridge:
  ros__parameters:
    port: ""                      # "" = auto: the sensor board streaming flex data and no IMU
    flex_channels: [0, 1, 2]      # 0 = A2, 1 = A3, 2 = TX
    flex_names: ["flex1 tip", "flex2 mid", "flex3 base"]
    bend_length_cm: 27.0          # bendable length of the arm
    flex_from_cm: [16.0, 5.0, 0.0]    # each sensor's span, cm from the base (measure these)
    flex_to_cm: [27.0, 16.0, 5.0]     # flex3 ends where flex2 starts (no overlap); the rest of flex3 sits on
                                      # the rigid base (prebent) -- Set flat with the arm straight zeroes that
    flex_r_fixed_ohm: 10000.0     # divider resistor to GND
    flex_vcc_v: 3.3

test_runner:
  ros__parameters:
    data_dir: ""              # "" = $RCM_DATA or $RCM_ROOT/data
    protocols_dir: ""         # "" = source tree protocols/ (live-editable)

dashboard:
  ros__parameters:
    host: "127.0.0.1"         # 0.0.0.0 to let teammates connect over the LAN
    port: 8080
