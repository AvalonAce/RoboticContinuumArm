protocol: max_bend
description: >
  Pull one tendon (others pay out) in steps until the tip IMU reads target_deg, then release
  back to straight in the same steps. Records counts/mm vs IMU tilt (pull + release curves),
  loads at every step, and counts-per-degree. Run Calibrate first; sensor board plugged in.
params:
  tendon: 3               # tendon that pulls
  target_deg: 90          # stop when IMU tilt-from-straight reaches this
  step_counts: 15         # ~0.25 mm of line per step
  release_ratio: 0.5      # others pay out this x the pull (CC model: 1 : 1/2 : 1/2). 0 = hold, 1 = equal
  max_travel_counts: 1800 # hard stop (~30 mm)
  load_limit: 700         # stop if any |load| reaches this (bridge trips at 900)
  speed: 150
  sample_s: 0.3
  return_steps: true      # release in steps (records hysteresis); false = go straight back
  require_imu: true
