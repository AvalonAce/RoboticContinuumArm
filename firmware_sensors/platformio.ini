; Sensor board: Adafruit QT Py ESP32 (+ ICM-20948 IMU on STEMMA QT, flex sensors later)
; Pick the env matching the label on your board:
;   pio run -e qtpy_s3 -t upload      QT Py ESP32-S3 (no PSRAM, 8 MB)
;   pio run -e qtpy_s3_psram ...      QT Py ESP32-S3 (4 MB flash, 2 MB PSRAM)
;   pio run -e qtpy_s2 ...            QT Py ESP32-S2
;   pio run -e qtpy_pico ...          QT Py ESP32 Pico
; (boot.sh: `rcm sflash` auto-detects S2/S3 from the USB name)

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
    adafruit/Adafruit ICM20X
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO

[env:qtpy_s3]
board = adafruit_qtpy_esp32s3_nopsram
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:qtpy_s3_psram]
board = adafruit_qtpy_esp32s3_n4r2
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:qtpy_s2]
board = adafruit_qtpy_esp32s2
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:qtpy_pico]
board = adafruit_qtpy_esp32
